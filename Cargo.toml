[package]
name = "requestsautomation"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lints.rust]
unsafe_code = "forbid"
#unused = { level = "allow", priority = -1}

[dependencies]
num-traits = "0.2"
reqwest = { version = "0.13.2", default-features = false, features = [
    "rustls",
    "json",
] } # reqwest with JSON parsing support
futures = "0.3.32" # for our async / await blocks
#axum = {version="0.7.4"}
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44" # for our async runtime
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_derive = "1.0.228"
polars = { version = "0.39.2", features = [
    "dtype-time",
    "temporal",
    "dtype-datetime",
    "dtype-date",
    "lazy",
    "json",
    "serde",
    "strings",
    "regex",
] }
toml = "0.9.8"
async-trait = "0.1.88"
strum_macros = "0.28.0"
csv = "1.3"
chrono = { version = "0.4.44" }
prost = "0.14.3"
prost-types = "0.14.3"
tonic-reflection = "0.14.3"
tonic = "0.14.3"
tonic-prost = "0.14.3"
config = "0.15.11"
surrealdb = "3.0.4"
surrealdb-types = "3.0.4"
thiserror = "2.0.18"

[profile.release]
#link time optimization - better optimization
lto = true
#quicker build but slower runtime
codegen-units = 1
panic = "abort"


[dev-dependencies]
assert_fs = "1.1"


[build-dependencies]
tonic-build = "0.14.3"
tonic-prost-build = "0.14.3"
